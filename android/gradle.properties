# Сборка идёт на машине с 2 ГБ памяти без swap: держим кучу на 1 ГБ, Kotlin компилируем
# в процессе Gradle, без параллельных воркеров. SerialGC держит RSS ниже, чем ParallelGC.
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
