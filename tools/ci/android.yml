name: Android APK

# Сборка APK с ядром цепочки Amnezia (AmneziaWG → SSH → MTP) в облаке GitHub.
# Запуск: Actions → «Android APK» → Run workflow. Готовый APK появится в артефактах запуска.

# ВАЖНО: этот файл надо положить в .github/workflows/android.yml — так GitHub включит сборку.
# Токен агента не имеет права создавать файлы workflow, поэтому здесь он лежит как заготовка.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: APK (ядро + приложение)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Go-ядро: тесты и сборка под телефон
        working-directory: mobile
        run: |
          go vet ./...
          go test ./...
          sh ./build-android.sh

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle + SDK
        working-directory: android
        run: |
          # local.properties в репозитории хранит путь с другой машины
          rm -f local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Сборка APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Проверка: ядро внутри APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'libusatyi_core|classes.dex' || (echo 'в APK нет ядра!' && exit 1)

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: usatyi-vpn-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
